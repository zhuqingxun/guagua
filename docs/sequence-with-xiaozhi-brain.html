<body>
<div class="container">

<header>
  <h1>GUAGUA 时序图 · 用户对话 → 鸭子回应</h1>
  <p class="subtitle">UML lifeline + 真实耗时激活条 + 并发可视化 · 跟 <a href="architecture-with-xiaozhi-brain.html" style="color:#3b82f6">architecture-with-xiaozhi-brain.html</a> 配套阅读</p>
</header>

<div class="diagram-wrap">
<svg class="diagram" viewBox="0 0 1500 990" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arr-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== 区域标题 ===== -->
  <text x="225" y="40" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">▼ 呱呱本体 (On-Device)</text>
  <text x="940" y="40" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">▼ 小智云端 (xiaozhi.me)</text>

  <!-- ===== 网络边界 ===== -->
  <rect x="378" y="55" width="144" height="22" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="450" y="71" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">📶 WiFi / WSS 网络边界</text>
  <line x1="450" y1="100" x2="450" y2="930" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,6"/>

  <!-- ===== Actor 头部 ===== -->
  <!-- 用户 -->
  <g>
    <rect x="55" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="103" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">👤 用户</text>
    <text x="115" y="120" font-size="10" fill="#475569" text-anchor="middle">说话 / 听 / 看</text>
  </g>
  <line x1="115" y1="130" x2="115" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- py-xiaozhi -->
  <g>
    <rect x="225" y="80" width="160" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="305" y="103" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">🦆 py-xiaozhi</text>
    <text x="305" y="120" font-size="10" fill="#475569" text-anchor="middle">本地语音客户端</text>
  </g>
  <line x1="305" y1="130" x2="305" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ASR -->
  <g>
    <rect x="520" y="80" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="585" y="103" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">🎙️ ASR</text>
    <text x="585" y="120" font-size="10" fill="#475569" text-anchor="middle">语音识别</text>
  </g>
  <line x1="585" y1="130" x2="585" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- LLM (重点突出 ⭐) -->
  <g>
    <rect x="700" y="75" width="150" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
    <text x="775" y="100" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">🧠 LLM 大脑 ⭐</text>
    <text x="775" y="118" font-size="10" fill="#475569" text-anchor="middle">DeepSeek / Qwen</text>
    <text x="775" y="130" font-size="9" fill="#a16207" text-anchor="middle">思考 + 决策调工具</text>
  </g>
  <line x1="775" y1="135" x2="775" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- TTS -->
  <g>
    <rect x="900" y="80" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="965" y="103" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">🗣️ TTS</text>
    <text x="965" y="120" font-size="10" fill="#475569" text-anchor="middle">语音合成</text>
  </g>
  <line x1="965" y1="130" x2="965" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- MCP / 执行层 -->
  <g>
    <rect x="1100" y="80" width="180" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1190" y="103" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">⚙️ MCP / Skill / ONNX</text>
    <text x="1190" y="120" font-size="10" fill="#475569" text-anchor="middle">本地执行层 + 舵机</text>
  </g>
  <line x1="1190" y1="130" x2="1190" y2="930" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ===== 精确时间标尺 (左侧) ===== -->
  <!-- 时间映射: y = 140 + t * 220, 即 1s = 220px -->
  <g>
    <line x1="38" y1="140" x2="38" y2="930" stroke="#475569" stroke-width="1.5"/>
    <text x="36" y="155" font-size="9" fill="#64748b" text-anchor="end" font-weight="700">T</text>

    <line x1="32" y1="140" x2="44" y2="140" stroke="#475569" stroke-width="1.5"/>
    <text x="30" y="144" font-size="10" fill="#475569" text-anchor="end" font-family="monospace" font-weight="600">0.0s</text>
    <line x1="34" y1="250" x2="42" y2="250" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="254" font-size="10" fill="#94a3b8" text-anchor="end" font-family="monospace">0.5s</text>
    <line x1="32" y1="360" x2="44" y2="360" stroke="#475569" stroke-width="1.5"/>
    <text x="30" y="364" font-size="10" fill="#475569" text-anchor="end" font-family="monospace" font-weight="600">1.0s</text>
    <line x1="34" y1="470" x2="42" y2="470" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="474" font-size="10" fill="#94a3b8" text-anchor="end" font-family="monospace">1.5s</text>
    <line x1="32" y1="580" x2="44" y2="580" stroke="#475569" stroke-width="1.5"/>
    <text x="30" y="584" font-size="10" fill="#475569" text-anchor="end" font-family="monospace" font-weight="600">2.0s</text>
    <line x1="34" y1="690" x2="42" y2="690" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="694" font-size="10" fill="#94a3b8" text-anchor="end" font-family="monospace">2.5s</text>
    <line x1="32" y1="800" x2="44" y2="800" stroke="#475569" stroke-width="1.5"/>
    <text x="30" y="804" font-size="10" fill="#475569" text-anchor="end" font-family="monospace" font-weight="600">3.0s</text>
    <line x1="34" y1="910" x2="42" y2="910" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="914" font-size="10" fill="#94a3b8" text-anchor="end" font-family="monospace">3.5s</text>
  </g>

  <!-- 时间网格 (水平浅线, 帮助对齐) -->
  <g stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2,4">
    <line x1="50" y1="250" x2="1290" y2="250"/>
    <line x1="50" y1="360" x2="1290" y2="360"/>
    <line x1="50" y1="470" x2="1290" y2="470"/>
    <line x1="50" y1="690" x2="1290" y2="690"/>
    <line x1="50" y1="910" x2="1290" y2="910"/>
  </g>

  <!-- ===== 并发高亮带 ===== -->
  <!-- T+2.0s~3.0s: TTS + MCP 并行执行 -->
  <rect x="50" y="580" width="1240" height="220" fill="#d1fae5" opacity="0.35"/>
  <text x="60" y="595" font-size="11" fill="#047857" font-weight="700">⚡ 并发执行区 (T+2.0s ~ 3.0s)</text>
  <text x="60" y="610" font-size="10" fill="#065f46">TTS 播放 ⫼ MCP 舵机执行 — 用户同时听到 + 看到</text>

  <!-- ===== 激活条 (高度按真实耗时) ===== -->

  <!-- 用户激活 1: 说话 (T=0~0.4s, y=140~228) -->
  <rect x="108" y="140" width="14" height="88" fill="#bfdbfe" stroke="#3b82f6" stroke-width="0.8" opacity="0.85"/>

  <!-- 用户激活 2: 听 (T=2.3~3.0s, y=646~800) -->
  <rect x="108" y="646" width="14" height="154" fill="#bfdbfe" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>

  <!-- 用户激活 3: 看到挥手 (T=2.5~3.5s, y=690~910) -->
  <rect x="124" y="690" width="6" height="220" fill="#bfdbfe" stroke="#3b82f6" stroke-width="0.5" opacity="0.6" stroke-dasharray="2,2"/>

  <!-- py-xiaozhi 激活 1: 拾音+WSS 上行 (T=0.1~0.9s, y=162~338) -->
  <rect x="298" y="162" width="14" height="176" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="0.8" opacity="0.85"/>

  <!-- py-xiaozhi 激活 2: 播放 TTS (T=2.2~3.0s, y=624~800) -->
  <rect x="298" y="624" width="14" height="176" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="0.8" opacity="0.85"/>

  <!-- ASR 激活 (T=0.3~0.9s, y=206~338) -->
  <rect x="578" y="206" width="14" height="132" fill="#fde68a" stroke="#f59e0b" stroke-width="0.8" opacity="0.85"/>

  <!-- LLM 激活 (T=0.9~2.0s, y=338~580) — 最长 -->
  <rect x="768" y="338" width="14" height="242" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.2" opacity="0.95"/>

  <!-- TTS 激活 (T=2.0~2.8s, y=580~756) -->
  <rect x="958" y="580" width="14" height="176" fill="#fed7aa" stroke="#fb923c" stroke-width="0.8" opacity="0.9"/>

  <!-- MCP 激活 (T=2.0~3.5s, y=580~910) — 最长, 含舵机执行 -->
  <rect x="1183" y="580" width="14" height="330" fill="#fecaca" stroke="#ef4444" stroke-width="1" opacity="0.9"/>

  <!-- ===== 消息箭头 (Y 位置严格按真实时间) ===== -->

  <!-- 消息 1: 用户(T=0.1s) → py-xiaozhi -->
  <line x1="120" y1="162" x2="298" y2="162" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="135" y="155" font-size="11.5" fill="#1e293b" font-weight="600">1️⃣ 说话: "想看你挥手~"</text>
  <text x="135" y="175" font-size="10" fill="#64748b" font-style="italic">PCM 16kHz 音频流</text>

  <!-- 消息 2: py-xiaozhi(T=0.3s) → ASR -->
  <line x1="312" y1="206" x2="578" y2="206" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="325" y="199" font-size="11.5" fill="#1e293b" font-weight="600">2️⃣ WSS 上行 (Opus 流式)</text>
  <text x="325" y="219" font-size="10" fill="#64748b" font-style="italic">边说边传</text>

  <!-- 消息 3: ASR(T=0.9s) → LLM -->
  <line x1="592" y1="338" x2="768" y2="338" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="600" y="331" font-size="11.5" fill="#1e293b" font-weight="600">3️⃣ 识别文字</text>
  <text x="600" y="352" font-size="10" fill="#64748b" font-style="italic">"想看你挥手~"</text>

  <!-- LLM self-loop: 推理 (T=1.0~1.8s) -->
  <path d="M 782 410 Q 870 410 870 470 Q 870 530 782 530" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-dashed)"/>
  <text x="878" y="455" font-size="10.5" fill="#475569" font-style="italic">读 prompt</text>
  <text x="878" y="473" font-size="10.5" fill="#475569" font-style="italic">+ 工具 Schema</text>
  <text x="878" y="491" font-size="10.5" fill="#475569" font-style="italic">→ 生成回复</text>
  <text x="878" y="509" font-size="10.5" fill="#475569" font-style="italic">+ 选工具</text>

  <!-- 消息 4: LLM(T=2.0s) → TTS -->
  <line x1="782" y1="585" x2="958" y2="585" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="790" y="578" font-size="11.5" fill="#1e293b" font-weight="600">4️⃣ 回复文字</text>
  <text x="790" y="599" font-size="10" fill="#64748b" font-style="italic">"好呀~ 让我试试"</text>

  <!-- 消息 5: LLM(T=2.0s) → MCP (并发分叉) -->
  <line x1="782" y1="595" x2="1183" y2="595" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="850" y="588" font-size="11.5" fill="#047857" font-weight="700">5️⃣ MCP 工具调用 (并发分叉 ⚡)</text>
  <text x="850" y="608" font-size="10" fill="#059669" font-style="italic">wave_hand({"speed":"normal"})</text>

  <!-- 消息 6: TTS(T=2.2s) → py-xiaozhi (下行) -->
  <line x1="958" y1="624" x2="312" y2="624" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="370" y="617" font-size="11.5" fill="#1e293b" font-weight="600">6️⃣ TTS 音频下行 (WSS)</text>
  <text x="370" y="638" font-size="10" fill="#64748b" font-style="italic">流式音频帧</text>

  <!-- 消息 7: py-xiaozhi(T=2.3s) → 用户 (Speaker 播放) -->
  <line x1="298" y1="646" x2="120" y2="646" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
  <text x="135" y="639" font-size="11.5" fill="#1e293b" font-weight="600">7️⃣ Speaker 播放</text>
  <text x="135" y="660" font-size="10" fill="#64748b" font-style="italic">"好呀~ 让我试试"</text>

  <!-- MCP self-loop: Skill → ONNX → 14 关节 (T=2.0~3.5s 内部) -->
  <path d="M 1197 700 Q 1280 700 1280 760 Q 1280 820 1197 820" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-dashed)"/>
  <text x="1288" y="745" font-size="10.5" fill="#475569" font-style="italic">Skill 翻译</text>
  <text x="1288" y="763" font-size="10.5" fill="#475569" font-style="italic">→ 7 维 command</text>
  <text x="1288" y="781" font-size="10.5" fill="#475569" font-style="italic">→ ONNX 50Hz</text>
  <text x="1288" y="799" font-size="10.5" fill="#475569" font-style="italic">→ 14 ST3215</text>

  <!-- 消息 8: MCP(T=2.5s) → 用户 (物理观察) -->
  <line x1="1183" y1="700" x2="120" y2="700" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="500" y="693" font-size="12" fill="#047857" font-weight="700">8️⃣ 🤚 物理动作: 鸭子挥手! (持续 ~1s)</text>
  <text x="500" y="715" font-size="10" fill="#059669" font-style="italic">用户同时看到挥手 + 听到 TTS 回复 (跟 ⑦ 在同一时段)</text>

  <!-- ===== 关键标注: 各激活条耗时 ===== -->
  <text x="328" y="252" font-size="9" fill="#7c3aed" font-family="monospace" font-style="italic">0.8s 拾音+上行</text>
  <text x="608" y="276" font-size="9" fill="#b45309" font-family="monospace" font-style="italic">0.6s 流式识别</text>
  <text x="790" y="463" font-size="11" fill="#854d0e" font-family="monospace" font-weight="700">⏱ 1.1s 思考</text>
  <text x="790" y="478" font-size="9" fill="#854d0e" font-family="monospace" font-style="italic">(最耗时!)</text>
  <text x="978" y="672" font-size="9" fill="#c2410c" font-family="monospace" font-style="italic">0.8s 合成</text>
  <text x="1203" y="760" font-size="9" fill="#991b1b" font-family="monospace" font-style="italic">1.5s 舵机执行</text>

  <!-- ===== 底部 legend ===== -->
  <g transform="translate(60, 945)">
    <line x1="0" y1="5" x2="40" y2="5" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-solid)"/>
    <text x="46" y="9" font-size="10.5" fill="#475569">同步消息</text>

    <line x1="180" y1="5" x2="220" y2="5" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="226" y="9" font-size="10.5" fill="#475569">异步 / 内部计算</text>

    <line x1="370" y1="5" x2="410" y2="5" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="416" y="9" font-size="10.5" fill="#475569">物理观察 / 并发分叉</text>

    <rect x="600" y="0" width="14" height="10" fill="#fef3c7" stroke="#ca8a04" stroke-width="0.8" opacity="0.95"/>
    <text x="620" y="9" font-size="10.5" fill="#475569">激活条 (高度 = 真实耗时)</text>

    <rect x="850" y="0" width="40" height="10" fill="#d1fae5" opacity="0.6"/>
    <text x="896" y="9" font-size="10.5" fill="#475569">并发高亮带</text>
  </g>

</svg>
